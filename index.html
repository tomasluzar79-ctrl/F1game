 else {g.fillStyle='#4d4937';g.fillRect(-1.2,-12,2.4,12);let ht=15+seed*.11;if(track===2){for(let l=0;l<3;l++)poly(['#284d49','#325a50','#406a59'][l],[-(8-l*2),-4-l*5],[0,-ht-l*3],[8-l*2,-4-l*5])}else{for(let k=0;k<3;k++){g.fillStyle=['#34594b','#436b51','#63805a'][k];g.beginPath();g.ellipse(k*2-3,-ht+k,7-k,9-k,-.3,0,7);g.fill()}}}g.restore()}
const rearView=new Image();
rearView.src='assets/formula.png';
function seeded(seed){
 return ()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}
}
function surface(w,h){let image=document.createElement('canvas');image.width=w;image.height=h;return image}
function asphalt(){
 const tex=surface(384,256),ctx=tex.getContext('2d'),data=ctx.createImageData(tex.width,tex.height),noise=seeded(27);
 for(let y=0;y<tex.height;y++)for(let x=0;x<tex.width;x++){
  const u=x/tex.width,lines=Math.exp(-Math.pow((u-.38)*22,2))+Math.exp(-Math.pow((u-.62)*22,2));
  let v=69+noise()*17-8*lines+3*Math.sin(u*48);const i=(y*tex.width+x)*4;

const pavement=asphalt(),trees=[];
function foliage(pine,variant){
 const tile=surface(160,212),c=tile.getContext('2d'),rand=seeded(141+variant*97+pine*987);
 c.fillStyle='#4a4339';c.fillRect(75,75,7,137);
 for(let i=0;i<550;i++){
  let y=8+rand()*162,half=pine?(y/175)*65:Math.sqrt(Math.max(0,1-((y-87)/86)**2))*61;

 const tile=surface(520,175),c=tile.getContext('2d'),rand=seeded(17);
 for(let row=0;row<8;row++){

const grandstand=makeStand();
function roadSurface(a,b,width){

function realScenery(x,y,s,n,side){

  if(mod(n,8)===0)g.drawImage(grandstand,x-24*s,y-14*s,48*s,14*s);return

 if(track===1){scenery(x,y,s,n,side);return}
 let pine=track===2,idx=mod(n*7+side,3)+(pine?3:0),height=(pine?16:13)+mod(n,5);

function rail(a,b,r){
 const wall=(low,high,color)=>poly(color,[a.x+r*a.s,a.y-low*a.s],[a.x+r*a.s,a.y-high*a.s],[b.x+r*b.s,b.y-high*b.s],[b.x+r*b.s,b.y-low*b.s]);
 wall(0,.83,'#6d797e');wall(.2,.28,'#c1c8c5');wall(.47,.54,'#3f4d54');wall(.72,.84,'#cbd1cf');
 if(b.z<160&&b.z>3){wall(1.35,1.38,'#48565b');wall(1.85,1.88,'#596668');if(b.n%2===0){g.fillStyle='#526168';g.fillRect(b.x+r*b.s,b.y-1.9*b.s,Math.max(.6,.07*b.s),1.1*b.s)}}
}

function cockpit(){
 const cx=W*.5, bottom=H+1,unit=Math.min(W*.60,H*.80);
 g.save();g.translate(cx+bodyYaw*unit*.065,bottom);g.scale(unit,unit);
 const paint=gradient(-.41,0,[[0,'#fe5945'],[.25,'#ed3326'],[.57,'#a91416'],[1,'#600c12']]);
 function strut(x1,y1,x2,y2,w,col){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
 for(const side of [-1,1]){
 g.save();g.scale(side,1);
 strut(.08,-.11,.46,-.24,.018,'#262c32');strut(.08,-.06,.48,-.20,.023,'#161b22');strut(.11,-.18,.44,-.18,.012,'#8a8e8f');
 g.save();g.translate(.47,-.23);g.rotate(steer*.055*side);
 const tyre=g.createLinearGradient(-.072,0,.072,0);[['#11161b',0],['#464d53',.19],['#30363d',.35],['#262b30',.76],['#0d1015',1]].forEach(([c,t])=>tyre.addColorStop(t,c));g.fillStyle=tyre;
 g.beginPath();g.roundRect(-.078,-.098,.156,.216,.044);g.fill();strut(-.057,-.074,-.057,.082,.003,'#d4af4c');g.restore();
 poly('#191e24',[.08,-.05],[.24,-.13],[.52,-.04],[.7,.05],[.10,.04]);
 poly(paint,[.09,-.04],[.23,-.1],[.46,-.01],[.5,.04],[.13,.04]);g.restore()
 }
 g.fillStyle=paint;g.beginPath();g.moveTo(-.14,.02);g.bezierCurveTo(-.10,-.15,-.044,-.24,-.031,-.39);g.quadraticCurveTo(0,-.413,.031,-.39);g.bezierCurveTo(.044,-.24,.10,-.15,.14,.02);g.fill();
 poly('#f6e8d6',[-.009,-.38],[.009,-.38],[.018,-.20],[-.018,-.20]);
 g.strokeStyle='#161b20';g.lineWidth=.048;g.beginPath();g.moveTo(-.34,.04);g.bezierCurveTo(-.26,-.09,-.09,-.149,0,-.15);g.bezierCurveTo(.09,-.149,.26,-.09,.34,.04);g.stroke();
 g.strokeStyle='#60686b';g.lineWidth=.004;g.stroke();strut(0,-.14,0,-.263,.018,'#252a30');g.restore()

function opponent(x,y,s,r){
 if(!rearView.complete||!rearView.naturalWidth){car(x,y,s*.021,r.c);return}
 const width=s*2.05,height=width*rearView.naturalHeight/rearView.naturalWidth;
 g.fillStyle='#17191c66';g.beginPath();g.ellipse(x,y,width*.52,height*.14,0,0,7);g.fill();
 g.drawImage(rearView,x-width/2,y-height,width,height);

function hill(s){if(track!==2)return 0;let f=mod(s,length)/length;return 18*Math.sin(f*6.283)+14*Math.tanh((f-.13)*55)-14*Math.tanh((f-.36)*15)+5*Math.sin(f*25.13)}
function draw(){
 horizon=H*.43;landscape();let focal=Math.min(W*.88,H*1.07),base=W*(.5-bodyYaw*.15),roadWidth=track===1?5.8:8,step=5,offset=mod(dist,step),samples=[],bend=0,bx=0,camHill=hill(dist),fraction=mod(dist,length)/length,tunnel=track===1&&fraction>.43&&fraction<.56;
 // Anchor road markings to the circuit and always keep a near clipping plane.

 for(let i=-1;i<106;i++){
  let z=i<0?1:firstPlane+i*step;
  if(i>=0&&z<=1)continue;
  const dz=z-previousZ, world=dist+z,delta=turn(dist+(z+previousZ)*.5)*dz;

  bend+=delta;previousZ=z;

  samples.push({z,x:base+(bx-cameraLane*roadWidth)*scale,y:horizon+(1.48-limit(hill(world)-camHill,-12,12)*.14)*scale,s:scale,n:Math.floor((world+.000001)/step)});
 }
 for(let i=samples.length-1;i>0;i--){let a=samples[i],b=samples[i-1],n=b.n;const band=(lo,hi,c)=>poly(c,[a.x+lo*a.s,a.y],[a.x+hi*a.s,a.y],[b.x+hi*b.s,b.y+.6],[b.x+lo*b.s,b.y+.6]);

 }
 if(mod(n,Math.round(length/step))===0){for(let k=0;k<14;k++)band(-roadWidth+2*roadWidth*k/14,-roadWidth+2*roadWidth*(k+1)/14,k%2?'#e9e9df':'#23262a')}

function start(){if(state!=='menu'&&state!=='finish'&&state!=='pause')return;resetHandling();state='count';dist=0;speed=0;lane=0;steer=0;elapsed=0;guard=0;count=3;keys.clear();rivals=colors.map((c,i)=>({c,d:16+i*16,l:(i%2?.46:-.46),v:0,pace:57+i*2}));$('menu').hidden=true;$('hud').hidden=false;$('touch').hidden=false;$('dialog').hidden=true;updateHud()}
function ranking(){return 1+rivals.filter(r=>r.d>dist).length}
function format(t){return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')}
function renderText(id,content,html=false){const node=$(id);if(node.dataset.value===content)return;node.dataset.value=content;if(html)node.innerHTML=content;else node.textContent=content}
function updateHud(){renderText('progress','<b>'+ranking()+'/6</b> &nbsp; Kolo '+Math.min(2,Math.floor(dist/length)+1)+'/2',true);renderText('clock',format(elapsed));renderText('speed',Math.round(speed*3.6)+' <small>km/h</small>',true)}
function showDialog(done){$('restart').hidden=done;state=done?'finish':'pause';keys.clear();$('dialog').hidden=false;$('touch').hidden=true;$('heading').textContent=done?(ranking()===1?'Vítězství!':'Cíl závodu'):'Pauza';$('result').textContent=done?ranking()+'. místo · '+format(elapsed):tracks[track][0];$('resume').textContent=done?'Další závod':'Pokračovat'}
function resume(){if(state==='finish')start();else if(state==='pause'){state=count>0?'count':'race';$('dialog').hidden=true;$('touch').hidden=false}}
function menu(){state='menu';$('menu').hidden=false;$('hud').hidden=true;$('dialog').hidden=true;$('touch').hidden=true;$('message').textContent='';keys.clear();select(track)}
$('restart').onclick=()=>{if(state==='pause')start()};$('start').onclick=start;$('resume').onclick=resume;$('back').onclick=menu;$('pause').onclick=()=>{if(state==='count'||state==='race')showDialog(false)};
function tick(dt){
 if(state==='menu')return;
 if(state==='count'){count-=dt;$('message').textContent=count<=0?'START':Math.ceil(count);if(count<=0)state='race';return}
 if(state!=='race')return;
 elapsed+=dt;if(elapsed>.8)$('message').textContent='';
 let gas=keys.has('ArrowUp'),brake=keys.has('ArrowDown'),input=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),curve=turn(dist+9),off=Math.abs(lane)>1;
 speed=limit(speed+dt*((gas?21*(1-speed/106): -3)-speed*.012-(brake?38:0)-(off?16:0)),0,91);
 const approach=(value,target,rate)=>mix(value,target,1-Math.exp(-rate*dt));
 steer=approach(steer,input,input===0?8:6);
 const outward=limit(curve*speed*speed*.013,-2.4,2.4);
 const grip=off?3.5:6.5;
 lateralSpeed=approach(lateralSpeed,steer*Math.min(speed*.11,2.1)-outward,grip);
 lane=limit(lane+lateralSpeed*dt,-1.32,1.32);
 if(Math.abs(lane)>=1.32&&Math.sign(lane)===Math.sign(lateralSpeed))lateralSpeed=0;
 cameraLane=approach(cameraLane,lane,8);
 bodyYaw=approach(bodyYaw,limit(steer*.16+curve*speed*.065,-.28,.28)*Math.min(1,speed/9),7);
 dist+=speed*dt;guard-=dt;
 for(let r of rivals){let upcoming=Math.max(Math.abs(turn(r.d+24)),Math.abs(turn(r.d+56)));let target=r.pace/(1+upcoming*22);r.v+=limit(target-r.v,-30*dt,12*dt);r.d+=r.v*dt;if(guard<=0&&Math.abs(r.d-dist)<4&&Math.abs(r.l-lane)<.27){speed*=.73;lateralSpeed+=(lane>=r.l?1:-1)*.95;guard=1}}
 if(dist>=length*2){updateHud();showDialog(true)}
}
const mapping={KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight'};
onkeydown=e=>{if(state==='menu')return;if(e.code==='Escape'&&!e.repeat){if(state==='pause')resume();else if(state==='race'||state==='count')showDialog(false);return}let k=mapping[e.code]||e.key;if(k.startsWith('Arrow')){keys.add(k);e.preventDefault()}};onkeyup=e=>keys.delete(mapping[e.code]||e.key);
for(let b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onlostpointercapture=()=>keys.delete(b.dataset.key)}

function frame(now){
 let remaining=last?Math.min((now-last)/1000,.12):0;last=now;
 while(remaining>0){const dt=Math.min(remaining,1/120);tick(dt);remaining-=dt}

}
select(0);requestAnimationFrame(frame);
</script></html>
