}

function start(){state='count';dist=0;speed=0;lane=0;steer=0;elapsed=0;guard=0;count=3;keys.clear();rivals=colors.map((c,i)=>({c,d:16+i*16,l:(i%2?.46:-.46),v:0,pace:57+i*2}));$('menu').hidden=true;$('hud').hidden=false;$('touch').hidden=false;$('dialog').hidden=true;updateHud()}
function ranking(){return 1+rivals.filter(r=>r.d>dist).length}
function format(t){return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')}
function updateHud(){$('progress').innerHTML='<b>'+ranking()+'/6</b> &nbsp; Kolo '+Math.min(2,Math.floor(dist/length)+1)+'/2';$('clock').textContent=format(elapsed);$('speed').innerHTML=Math.round(speed*3.6)+' <small>km/h</small>'}
function showDialog(done){state=done?'finish':'pause';keys.clear();$('dialog').hidden=false;$('touch').hidden=true;$('heading').textContent=done?(ranking()===1?'Vítězství!':'Cíl závodu'):'Pauza';$('result').textContent=done?ranking()+'. místo · '+format(elapsed):tracks[track][0];$('resume').textContent=done?'Další závod':'Pokračovat'}
function resume(){if(state==='finish')start();else if(state==='pause'){state=count>0?'count':'race';$('dialog').hidden=true;$('touch').hidden=false}}
function menu(){state='menu';$('menu').hidden=false;$('hud').hidden=true;$('dialog').hidden=true;$('touch').hidden=true;$('message').textContent='';keys.clear();select(track)}
$('start').onclick=start;$('resume').onclick=resume;$('back').onclick=menu;$('pause').onclick=()=>{if(state==='count'||state==='race')showDialog(false)};
function tick(dt){
 if(state==='menu'){dist+=dt*13;return}
 if(state==='count'){count-=dt;$('message').textContent=count<=0?'START':Math.ceil(count);if(count<=0)state='race';return}
 if(state!=='race')return;
 elapsed+=dt;if(elapsed>.8)$('message').textContent='';
 let gas=keys.has('ArrowUp'),brake=keys.has('ArrowDown'),input=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),curve=turn(dist+9),off=Math.abs(lane)>1;
 speed=limit(speed+dt*((gas?21*(1-speed/106): -3)-speed*.012-(brake?38:0)-(off?16:0)),0,91);
 steer=mix(steer,input,Math.min(1,dt*8));lane=limit(lane+dt*(steer*Math.min(speed*.13,2.2)-curve*speed*speed*.036),-1.32,1.32);dist+=speed*dt;guard-=dt;
 for(let r of rivals){let upcoming=Math.max(Math.abs(turn(r.d+24)),Math.abs(turn(r.d+56)));let target=r.pace/(1+upcoming*22);r.v+=limit(target-r.v,-30*dt,12*dt);r.d+=r.v*dt;if(guard<=0&&Math.abs(r.d-dist)<4&&Math.abs(r.l-lane)<.27){speed*=.73;lane=limit(lane+(lane>=r.l?.19:-.19),-1.32,1.32);guard=1}}
 updateHud();if(dist>=length*2)showDialog(true)
}
const mapping={KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight'};
onkeydown=e=>{if(state==='menu')return;if(e.code==='Escape'&&!e.repeat){if(state==='pause')resume();else if(state==='race'||state==='count')showDialog(false);return}let k=mapping[e.code]||e.key;if(k.startsWith('Arrow')){keys.add(k);e.preventDefault()}};onkeyup=e=>keys.delete(mapping[e.code]||e.key);
for(let b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onlostpointercapture=()=>keys.delete(b.dataset.key)}
onblur=()=>{keys.clear();if(state==='race'||state==='count')showDialog(false)};
function frame(now){let dt=Math.min((now-last)/1000,.06);last=now;tick(dt);draw();requestAnimationFrame(frame)}
select(0);requestAnimationFrame(frame);
</script></html>
