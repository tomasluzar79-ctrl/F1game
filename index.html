 for(let j=0;j<3;j++)buf[i+j]=mix(buf[i+j],Math.min(255,(color>>(16-j*8)&255)*shade+Math.min(green,blue)*.22),w)}
 ctx.putImageData(pixels,0,0);liveries.set(r.c,tex);return tex
}
function trackDetails(a,b,band,width,n){
 const bend=turn(dist+b.z),wet=track===2;
 if(wet){band(-width,width,'#a9bfd21b');if(n%9===1)band(-width*.62,-width*.33,'#c5d7dd38')}
 const side=Math.sign(bend),offset=side*Math.min(width*.48,Math.abs(bend)*width*16);
 if(Math.abs(bend)>.003){band(offset-.95,offset-.68,'#16191c2c');band(offset+.68,offset+.95,'#16191c2c')}
 if(n%8!==0||b.z<4||b.z>200)return;
 if(track===1){
 const s=b.s,x=b.x-(width+3)*s,y=b.y,ht=6*s;
 g.fillStyle='#53616c';g.fillRect(x,y-ht,.09*s,ht);g.fillStyle='#ffe8a5';g.fillRect(x-.35*s,y-ht,1.3*s,.16*s);
 const glow=g.createRadialGradient(x,y-ht,0,x,y-ht,1.4*s);glow.addColorStop(0,'#ffde932e');glow.addColorStop(1,'#ffe28e00');g.fillStyle=glow;g.fillRect(x-1.4*s,y-ht-1.4*s,2.8*s,2.8*s)
 }
}
function circuitDisplay(){
 const cv=$('radar'),ctx=cv.getContext('2d'),pts=raw[track],w=cv.width,h=cv.height;
 ctx.clearRect(0,0,w,h);let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
 for(const [x,y] of pts){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
 const z=Math.min((w-18)/(maxX-minX),(h-16)/(maxY-minY)),px=x=>(w-(maxX-minX)*z)/2+(x-minX)*z,py=y=>(h-(maxY-minY)*z)/2+(maxY-y)*z;
 ctx.lineJoin='round';ctx.beginPath();let sum=0;const marks=[];
 for(let i=0;i<pts.length;i++){const p=pts[i],next=pts[(i+1)%pts.length];if(i===0)ctx.moveTo(px(p[0]),py(p[1]));else ctx.lineTo(px(p[0]),py(p[1]));const len=Math.hypot(next[0]-p[0],next[1]-p[1]);if(len)marks.push([sum,len,p,next]);sum+=len}
 ctx.closePath();ctx.strokeStyle='#d5e1e5';ctx.lineWidth=2;ctx.stroke();
 for(const car of [...rivals,{d:dist,c:'#ff542f',player:true}]){let s=mod(car.d,length)*sum/length;const m=marks.find(a=>a[0]+a[1]>s)||marks[0],t=(s-m[0])/m[1];ctx.beginPath();ctx.arc(px(mix(m[2][0],m[3][0],t)),py(mix(m[2][1],m[3][1],t)),car.player?5:2.8,0,7);ctx.fillStyle=car.c;ctx.fill();if(car.player){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}}
}

function start(){if(state!=='menu'&&state!=='finish'&&state!=='pause')return;resetHandling();primeAudio();nextInfoAt=0;gear=1;rpm=.22;draft=0;lapStart=0;lapFlash=0;lapTimes=[];bestLap=readBest();state='count';dist=0;speed=0;lane=0;steer=0;elapsed=0;guard=0;count=3;$('message').dataset.lamps='';keys.clear();rivals=colors.map((c,i)=>({c,d:16+i*16,l:(i%2?.46:-.46),v:0,pace:57+i*2}));$('menu').hidden=true;$('hud').hidden=false;$('touch').hidden=false;$('dialog').hidden=true;updateHud()}
function ranking(){return 1+rivals.filter(r=>r.finished||r.d>dist).length}
function format(t){return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')}
function renderText(id,content,html=false){const node=$(id);if(node.dataset.value===content)return;node.dataset.value=content;if(html)node.innerHTML=content;else node.textContent=content}
let nextInfoAt=0;
function updateHud(){
 if(nextInfoAt===0||elapsed<nextInfoAt-.21||elapsed>=nextInfoAt){
 nextInfoAt=elapsed+.2;circuitDisplay();const ahead=upcomingCorner(dist);
 const target=Math.sqrt((track===2?16:22)/Math.max(.001,Math.abs(ahead.curve)));
 const brakeDistance=Math.max(0,(speed*speed-target*target)/65);
 const note=lapFlash>0&&lapTimes.length?'Čas kola '+format(lapTimes.at(-1)):brakeDistance>ahead.distance-18&&Math.abs(ahead.curve)>.009&&speed>target+4?(ahead.curve>0?'Brzdi · pravá zatáčka':'Brzdi · levá zatáčka'):draft>.32?'Jízda v závěsu':'';
 renderText('engineer',note)
 }renderText('progress','<b>'+ranking()+'/6</b> &nbsp; Kolo '+Math.min(2,Math.floor(dist/length)+1)+'/2',true);renderText('clock','<small>ČAS KOLA</small>'+format(Math.max(0,elapsed-lapStart)),true);renderText('speed','<i>G'+gear+'</i>'+Math.round(speed*3.6)+'<small>KM/H</small>',true)}
function showDialog(done){$('restart').hidden=done;state=done?'finish':'pause';mixAudio();keys.clear();$('dialog').hidden=false;$('touch').hidden=true;$('heading').textContent=done?(ranking()===1?'Vítězství!':'Cíl závodu'):'Pauza';$('result').textContent=done?ranking()+'. místo · '+format(elapsed)+' · Nejlepší kolo '+format(Math.min(...lapTimes))+' · Rekord okruhu '+format(bestLap):tracks[track][0];$('resume').textContent=done?'Další závod':'Pokračovat'}
function resume(){if(!muted)primeAudio();if(state==='finish')start();else if(state==='pause'){state=count>0?'count':'race';$('dialog').hidden=true;$('touch').hidden=false}}
function menu(){state='menu';mixAudio();$('menu').hidden=false;$('hud').hidden=true;$('dialog').hidden=true;$('touch').hidden=true;$('message').textContent='';keys.clear();select(track)}
$('restart').onclick=()=>{if(state==='pause')start()};$('start').onclick=start;$('resume').onclick=resume;$('back').onclick=menu;$('pause').onclick=()=>{if(state==='count'||state==='race')showDialog(false)};
function tick(dt){
 if(state==='menu')return;
 if(state==='count'){count-=dt;const lamps=limit(Math.floor((3-count)/.52)+1,1,5);
 if(count<=0){$('message').textContent='START';state='race'}else if($('message').dataset.lamps!==String(lamps)||!$('message').firstChild){$('message').dataset.lamps=String(lamps);$('message').innerHTML='<span class="lights" aria-label="Startovní světla">'+Array.from({length:5},(_,i)=>'<i class="'+(i<lamps?'lit':'')+'"></i>').join('')+'</span>'}return}
 if(state!=='race')return;
 elapsed+=dt;lapFlash=Math.max(0,lapFlash-dt);if(elapsed>.8&&$('message').textContent)$('message').textContent='';
 let gas=keys.has('ArrowUp'),brake=keys.has('ArrowDown'),input=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),curve=turn(dist+9),off=Math.abs(lane)>1;
 speed=limit(speed+dt*((gas?(21+draft*4)*(1-speed/(106+draft*7)): -3)-speed*.012-(brake?38:0)-(off?16:0)),0,91+draft*3);transmission(dt,gas);
 const approach=(value,target,rate)=>mix(value,target,1-Math.exp(-rate*dt));
 steer=approach(steer,input,input===0?8:6);
 const outward=limit(curve*speed*speed*(track===2?.016:.013),-2.4,2.4);
 const grip=off?3.3:track===2?4.5:6.5;
 lateralSpeed=approach(lateralSpeed,steer*Math.min(speed*.11,2.1)-outward,grip);
 lane=limit(lane+lateralSpeed*dt,-1.32,1.32);
 if(Math.abs(lane)>=1.32&&Math.sign(lane)===Math.sign(lateralSpeed))lateralSpeed=0;
 cameraLane=approach(cameraLane,lane,8);
 bodyYaw=approach(bodyYaw,limit(steer*.16+curve*speed*.065,-.28,.28)*Math.min(1,speed/9),7);
 const previous=dist;dist+=speed*dt;guard-=dt;
 if(Math.floor(dist/length)>Math.floor(previous/length))crossLine(elapsed-(dist%length)/Math.max(1,speed));
 raceOpponents(dt);
 if(dist>=length*2){updateHud();showDialog(true)}
}
const mapping={KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight'};
onkeydown=e=>{if(state==='menu')return;if(e.code==='Escape'&&!e.repeat){if(state==='pause')resume();else if(state==='race'||state==='count')showDialog(false);return}let k=mapping[e.code]||e.key;if(k.startsWith('Arrow')){keys.add(k);e.preventDefault()}};onkeyup=e=>keys.delete(mapping[e.code]||e.key);
for(let b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onlostpointercapture=()=>keys.delete(b.dataset.key)}
onblur=()=>{keys.clear();if(state==='race'||state==='count')showDialog(false)};
function frame(now){
 let remaining=last?Math.min((now-last)/1000,.12):0;last=now;
 while(remaining>0){const dt=Math.min(remaining,1/120);tick(dt);remaining-=dt}
 if(state==='count'||state==='race'){updateHud();mixAudio()}
 if(state!=='menu')draw();requestAnimationFrame(frame)
}
select(0);requestAnimationFrame(frame);
</script></html>
