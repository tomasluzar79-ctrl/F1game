// The circuit map and the simulation use metres, with east along the x axis.
let circuitShape,layout=[],segments=[],decor=[],tyreMarks=[],lastAxle=null,markTimer=0,clouds=[],camAngle=null;
let grassPattern,asphaltPattern,waterPattern;
const props={};
for(const name of ['oak','fir','stand','roof']){props[name]=new Image();props[name].src='assets/'+name+'.png'}

const overheadCars=['formula','coupe','sedan'].map(name=>{const img=new Image();img.src='assets/'+name+'-top.png';return img});
function matPattern(base,spread){
 const tile=surface(128,128),ctx=tile.getContext('2d'),data=ctx.createImageData(128,128),rand=seeded(53);
 for(let i=0;i<data.data.length;i+=4){let v=(rand()-.5)*spread;for(let c=0;c<3;c++)data.data[i+c]=base[c]+v;data.data[i+3]=255}
 ctx.putImageData(data,0,0);const pattern=g.createPattern(tile,'repeat');pattern.setTransform(new DOMMatrix().scale(.065));return pattern
}
function setupAerial(){
 layout=raw[track].map(([x,y])=>({x,y:-y}));
 if(layout[0].x===layout.at(-1).x&&layout[0].y===layout.at(-1).y)layout.pop();
 segments=[];let total=0;
 for(let i=0;i<layout.length;i++){let a=layout[i],b=layout[(i+1)%layout.length],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(!len)continue;segments.push({a,b,len,from:total});total+=len}
 circuitShape=new Path2D();circuitShape.moveTo(layout[0].x,layout[0].y);
 for(const p of layout.slice(1))circuitShape.lineTo(p.x,p.y);circuitShape.closePath();
 const rand=seeded(37+track);decor=[];
 for(let d=0;d<length;d+=8){let p=trackPose(d);for(let side of [-1,1]){
 let off=side*(18+rand()*42),kind=track===1?(side===1&&d/length>.4&&d/length<.77?'boat':'building'):'tree';
 if(d<125&&side<0){if(d%32===0)decor.push({kind:'stand',x:p.x-p.rx*25,y:p.y-p.ry*25,angle:p.angle,size:1,seed:rand()});continue}
 decor.push({kind,x:p.x+p.rx*off,y:p.y+p.ry*off,angle:p.angle,size:.72+rand()*.65,seed:rand()})
 }}
 grassPattern=matPattern(track===2?[77,100,63]:track===1?[163,154,138]:[105,122,72],26);
 asphaltPattern=matPattern([70,74,79],23);waterPattern=matPattern([62,133,143],12);
 tyreMarks=[];lastAxle=null;clouds=[];camAngle=null
}
function centreAt(d){
 const s=mod(d,length);let lo=0,hi=segments.length-1;
 while(lo<hi){let mid=(lo+hi+1)>>1;if(segments[mid].from<=s)lo=mid;else hi=mid-1}
 const seg=segments[lo],t=limit((s-seg.from)/seg.len,0,1);
 return {x:mix(seg.a.x,seg.b.x,t),y:mix(seg.a.y,seg.b.y,t)}
}
function trackPose(s){
 const p=centreAt(s),before=centreAt(s-5),after=centreAt(s+5),angle=Math.atan2(after.x-before.x,before.y-after.y);
 return {...p,angle,rx:Math.cos(angle),ry:Math.sin(angle)}
}
function playerPose(){return {x:worldX,y:worldY,angle:headingAngle}}
function stepAerial(dt){
 if(!segments.length)return;
 let p=playerPose(),heading=trackPose(dist+10).angle;
 if(camAngle===null)camAngle=heading;else camAngle+=Math.atan2(Math.sin(heading-camAngle),Math.cos(heading-camAngle))*(1-Math.exp(-3.5*dt));
 markTimer+=dt;
 if(Math.abs(slideAngle)>.13&&speed>8&&markTimer>=.045){
 markTimer=0;const rx=Math.cos(p.angle),ry=Math.sin(p.angle);
 let axle=[-1,1].map(sign=>[p.x-ry*1.6+rx*.85*sign,p.y+rx*1.6+ry*.85*sign]);
 if(lastAxle){tyreMarks.push([lastAxle,axle]);if(tyreMarks.length>600)tyreMarks.shift()}
 lastAxle=axle;
 for(let i=0;i<2;i++){clouds.push({x:axle[i][0],y:axle[i][1],age:0,vx:(Math.random()-.5)*1.7,vy:(Math.random()-.5)*1.7})}
 }else if(Math.abs(slideAngle)<=.13||speed<=8)lastAxle=null;
 for(let puff of clouds){puff.age+=dt;puff.x+=puff.vx*dt;puff.y+=puff.vy*dt}while(clouds.length&&clouds[0].age>1.35)clouds.shift()
}
const overheadTrees=new Map();
function canopy(obj){
 let id=(track===2?4:0)+Math.floor(obj.seed*4);if(overheadTrees.has(id))return overheadTrees.get(id);
 let img=surface(128,128),c=img.getContext('2d'),rand=seeded(551+id);
 c.fillStyle='#20271944';c.beginPath();c.ellipse(70,72,51,49,.2,0,7);c.fill();
 for(let i=0;i<350;i++){let theta=rand()*Math.PI*2,rad=Math.sqrt(rand())*45,x=61+Math.cos(theta)*rad,y=59+Math.sin(theta)*rad,r=4+rand()*9;
 let light=22+rand()*8+(60-y)*.14+(58-x)*.09+(1-rad/48)*7;c.fillStyle='hsl('+(id>=4?137:91)+' 27% '+light+'%)';c.beginPath();c.arc(x,y,r,0,7);c.fill()}
 overheadTrees.set(id,img);return img
}
function drawBuilding(obj){
 const {size,kind,seed}=obj;g.save();g.translate(obj.x,obj.y);g.rotate(obj.angle);g.scale(size,size);
 const prop=props[kind==='tree'?(track===2?'fir':'oak'):kind==='stand'?'stand':kind==='building'?'roof':''];
 if(prop&&prop.complete&&prop.naturalWidth){let w=kind==='stand'?13:kind==='building'?11:16,h=kind==='stand'?30:kind==='building'?15:16;
 g.fillStyle='#282b3250';g.save();g.translate(1.2,1.5);if(kind==='tree'){g.beginPath();g.ellipse(0,0,w*.42,h*.43,0,0,7);g.fill()}else g.fillRect(-w*.5,-h*.5,w,h);g.restore();
 g.drawImage(prop,-w*.5,-h*.5,w,h)}
 else if(kind==='tree'){g.drawImage(canopy(obj),-7,-7,14,14)}
 else if(kind==='boat'){g.fillStyle=waterPattern;g.fillRect(-11,-13,22,26);g.fillStyle='#eee8d9';g.beginPath();g.ellipse(0,0,2.3,6,0,0,7);g.fill();g.fillStyle='#475b64';g.fillRect(-1.3,-2.4,2.6,3.8)}
 else if(kind==='stand'){g.fillStyle='#39444a';g.fillRect(-6,-15,12,30);for(let j=-5;j<5;j+=1.3){g.fillStyle=j<0?'#bcc6c9':'#9e5d53';g.fillRect(j,-14,.85,28)}g.fillStyle='#e5e6db';g.fillRect(-6,-15,5,30)}
 else{g.fillStyle='#3b3a354a';g.fillRect(-3.4,-4.8,10,14);g.fillStyle=seed<.5?'#c58f74':'#d3c9b7';g.fillRect(-5,-7,10,14);g.fillStyle='#eadac8';g.fillRect(-5,-7,10,.5);g.fillStyle='#9d9d92';g.fillRect(-3,-3,2.4,3.1);g.fillStyle='#e1dbcd';g.fillRect(-3,-3,2.2,.4)}
 g.restore()
}
function drawMiniMap(){
 const size=Math.min(115,W*.17), ox=W-size-14,oy=H-size-(W<650?152:80);
 let xs=layout.map(p=>p.x),ys=layout.map(p=>p.y),left=Math.min(...xs),top=Math.min(...ys);
 const scale=size/Math.max(Math.max(...xs)-left,Math.max(...ys)-top);
 g.save();g.translate(ox,oy);g.scale(scale,scale);g.translate(-left,-top);g.lineWidth=4/scale;g.strokeStyle='#15202be0';g.stroke(circuitShape);g.lineWidth=1.8/scale;g.strokeStyle='#fffff0';g.stroke(circuitShape);
 g.fillStyle='#ff563a';g.beginPath();g.arc(worldX,worldY,4/scale,0,7);g.fill();g.restore()
}
function renderAerial(){
 let p=playerPose(),heading=camAngle??trackPose(dist).angle;
 let zoom=limit(Math.min(W/32,H/31),9,25)/(1+speed*.0055),anchor=H*(W<H?.64:.69);
 let reach=Math.hypot(W,H)/zoom+35,half=track===1?5.8:8;
 g.save();g.fillStyle='#60774b';g.fillRect(0,0,W,H);g.translate(W/2,anchor);g.scale(zoom,zoom);g.rotate(-heading);g.translate(-p.x,-p.y);
 g.fillStyle=grassPattern;g.fillRect(p.x-reach,p.y-reach,reach*2,reach*2);
 for(const obj of decor)if(Math.abs(obj.x-p.x)<reach&&Math.abs(obj.y-p.y)<reach)drawBuilding(obj);
 g.lineJoin='round';g.lineCap='butt';
 function outline(width,color,dash=[]){g.lineWidth=width;g.strokeStyle=color;g.setLineDash(dash);g.stroke(circuitShape)}
 outline(half*2+8,track===1?'#aea89a':'#8d9870');outline(half*2+5,'#5c6868');outline(half*2+4.5,'#bdc4bc');outline(half*2+4,'#b3a48c');
 outline(half*2+1.45,'#e4decf');outline(half*2+1.45,'#bd534a',[3.5,3.5]);outline(half*2,asphaltPattern);
 outline(half*2-.55,'#eae7da');outline(half*2-.82,asphaltPattern);
 g.strokeStyle='#1d20265c';g.lineWidth=.19;g.beginPath();for(let m of tyreMarks){if(Math.abs(m[0][0][0]-p.x)>reach||Math.abs(m[0][0][1]-p.y)>reach)continue;for(let side=0;side<2;side++){g.moveTo(...m[0][side]);g.lineTo(...m[1][side])}}g.stroke();
 for(let d=0;d<65;d+=8){let start=trackPose(d);if(Math.hypot(start.x-p.x,start.y-p.y)>reach)continue;
 g.save();g.translate(start.x,start.y);g.rotate(start.angle);
 if(!d){for(let k=0;k<16;k++)for(let j=0;j<2;j++){g.fillStyle=(k+j)%2?'#343940':'#e8e6da';g.fillRect(-half+k*half/8,j*.42,half/8+.015,.43)}}else{g.strokeStyle='#d9d6c78c';g.lineWidth=.09;g.strokeRect(d%16?1.5:-3.8,0,2.3,4.2)}g.restore()}
 g.save();g.translate(p.x,p.y);g.rotate(p.angle);let vehicleImg=overheadCars[vehicle],carLength=vehicle===0?5.7:4.75;
 if(vehicleImg.complete&&vehicleImg.naturalWidth){let w=carLength*vehicleImg.naturalWidth/vehicleImg.naturalHeight;g.fillStyle='#1b1c2080';g.beginPath();g.ellipse(.16,.18,w*.48,carLength*.48,0,0,7);g.fill();g.drawImage(vehicleImg,-w*.5,-carLength*.5,w,carLength)}
 else{g.fillStyle=['#e34739','#17aea3','#e1e6e8'][vehicle];g.fillRect(-1,-2.3,2,4.6);g.fillStyle='#172735';g.fillRect(-.75,-.85,1.5,1.4)}
 g.restore();
 for(let puff of clouds){let t=puff.age/1.35,r=.4+t*1.9;g.globalAlpha=(1-t)*.43;g.drawImage(smokeTile,puff.x-r,puff.y-r,r*2,r*2)}g.restore();drawMiniMap()
}

let worldX=0,worldY=0,velocityAngle=0,headingAngle=0,nearestIndex=0;
function placeVehicle(){
 const p=trackPose(0);worldX=p.x;worldY=p.y;headingAngle=velocityAngle=p.angle;
 nearestIndex=0;camAngle=p.angle;tyreMarks=[];lastAxle=null;clouds=[];markTimer=0
}
function moveVehicle(dt){
 const carSpec=cars[vehicle],half=track===1?5.8:8;
 // Heading responds to the front wheels. Tyre grip gradually aligns the velocity with the body.
 const yawRate=steer*Math.min(speed*.20,1.75)/(1+speed*.010);
 headingAngle+=yawRate*dt;
 const target=headingAngle-slideAngle*.88;
 const error=Math.atan2(Math.sin(target-velocityAngle),Math.cos(target-velocityAngle));
 velocityAngle+=error*(1-Math.exp(-(carSpec.grip/(1+Math.abs(slideAngle)*1.5))*dt));
 worldX+=Math.sin(velocityAngle)*speed*dt;worldY-=Math.cos(velocityAngle)*speed*dt;
 let closest=null,best=Infinity;
 for(let j=-3;j<=3;j++){let idx=mod(nearestIndex+j,segments.length),seg=segments[idx];
 const dx=seg.b.x-seg.a.x,dy=seg.b.y-seg.a.y,t=limit(((worldX-seg.a.x)*dx+(worldY-seg.a.y)*dy)/(seg.len*seg.len),0,1);
 const x=seg.a.x+t*dx,y=seg.a.y+t*dy,sq=(worldX-x)**2+(worldY-y)**2;
 if(sq<best){best=sq;closest={idx,seg,t,x,y}}
 }
 nearestIndex=closest.idx;const s=closest.seg.from+closest.t*closest.seg.len;
 let delta=mod(s-mod(dist,length)+length*.5,length)-length*.5;
 dist+=delta;
 const rx=(closest.seg.a.y-closest.seg.b.y)/closest.seg.len,ry=(closest.seg.b.x-closest.seg.a.x)/closest.seg.len;
 let sideways=(worldX-closest.x)*rx+(worldY-closest.y)*ry;
 lane=sideways/half;
 if(Math.abs(sideways)>half+1.25){
 const side=Math.sign(sideways),forward=trackPose(s).angle;
 worldX=closest.x+rx*(half+1.18)*side;worldY=closest.y+ry*(half+1.18)*side;
 speed*=Math.exp(-2.1*dt);
 const unwind=Math.atan2(Math.sin(forward-headingAngle),Math.cos(forward-headingAngle));
 headingAngle+=unwind*(1-Math.exp(-3.6*dt));velocityAngle=headingAngle
 }
 stepAerial(dt)
}
function start(){if(state!=='menu'&&state!=='finish'&&state!=='pause')return;resetHandling();resetRun();placeVehicle();state='count';dist=0;speed=0;lane=0;steer=0;elapsed=0;guard=0;count=3;keys.clear();$('menu').hidden=true;$('hud').hidden=false;$('touch').hidden=false;$('dialog').hidden=true;updateHud()}
function format(t){return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')}
function renderText(id,content,html=false){const node=$(id);if(node.dataset.value===content)return;node.dataset.value=content;if(html)node.innerHTML=content;else node.textContent=content}
function updateHud(){
 renderText('progress','Kolo <b>'+limit(Math.floor(dist/length)+1,1,2)+'/2</b> &nbsp; '+tracks[track][0],true);
 renderText('clock','<small>DRIFT BODY</small><b>'+Math.floor(score).toLocaleString('cs-CZ')+'</b>',true);
 renderText('driftInfo',offTimer?'Mimo trať · série ukončena':chain>=1?'+'+Math.floor(chain)+'  ×'+multiplier:'');
 renderText('speed',Math.round(speed*3.6)+' <small>km/h</small>',true)
}
function showDialog(done){
 $('restart').hidden=done;state=done?'finish':'pause';keys.clear();$('dialog').hidden=false;$('touch').hidden=true;
 $('heading').textContent=done?(sessionRecord?'Nový osobní rekord!':'Výsledek jízdy'):'Pauza';
 $('result').textContent=done?score+' bodů · Nejlepší série '+bestChain+' · Osobní rekord '+record:tracks[track][0]+' · '+cars[vehicle].name;
 $('resume').textContent=done?'Jet znovu':'Pokračovat'
}
function resume(){if(state==='finish')start();else if(state==='pause'){state=count>0?'count':'race';$('dialog').hidden=true;$('touch').hidden=false}}
function menu(){state='menu';$('menu').hidden=false;$('hud').hidden=true;$('dialog').hidden=true;$('touch').hidden=true;$('message').textContent='';keys.clear();select(track)}
$('restart').onclick=()=>{if(state==='pause')start()};$('start').onclick=start;$('resume').onclick=resume;$('back').onclick=menu;$('pause').onclick=()=>{if(state==='count'||state==='race')showDialog(false)};
function tick(dt){
 if(state==='menu')return;
 if(state==='count'){count-=dt;$('message').textContent=count<=0?'START':Math.ceil(count);if(count<=0)state='race';return}
 if(state!=='race')return;
 elapsed+=dt;if(elapsed>.8)$('message').textContent='';
 let gas=keys.has('ArrowUp'),brake=keys.has('ArrowDown'),input=Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')),curve=turn(dist+9),off=Math.abs(lane)>1;
 const spec=cars[vehicle];speed=limit(speed+dt*((gas?spec.power*(1-speed/(spec.top+8)):-2.5)-speed*.012-(brake?34:0)-(off?17:0)-Math.abs(slideAngle)*3),0,spec.top);
 updateSlide(dt,input,curve,gas,off);
 const approach=(value,target,rate)=>mix(value,target,1-Math.exp(-rate*dt));
 steer=approach(steer,input,input===0?8:6);
 moveVehicle(dt);
 if(dist>=length*2)finishRun()
}
const mapping={Space:'Drift',KeyW:'ArrowUp',KeyS:'ArrowDown',KeyA:'ArrowLeft',KeyD:'ArrowRight'};
onkeydown=e=>{if(state==='menu')return;if(e.code==='Escape'&&!e.repeat){if(state==='pause')resume();else if(state==='race'||state==='count')showDialog(false);return}let k=mapping[e.code]||e.key;if(k.startsWith('Arrow')||k==='Drift'){keys.add(k);e.preventDefault()}};onkeyup=e=>keys.delete(mapping[e.code]||e.key);
for(let b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onlostpointercapture=()=>keys.delete(b.dataset.key)}
onblur=()=>{keys.clear();if(state==='race'||state==='count')showDialog(false)};
function frame(now){
 let remaining=last?Math.min((now-last)/1000,.12):0;last=now;
 while(remaining>0){const dt=Math.min(remaining,1/120);tick(dt);remaining-=dt}
 if(state==='count'||state==='race')updateHud();
 if(state!=='menu')renderAerial();requestAnimationFrame(frame)
}
select(0);selectCar(1);requestAnimationFrame(frame);
</script></html>
