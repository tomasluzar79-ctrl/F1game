/* ===== ROZSIRENI SEDA FRONTA =====
   3 zivoty, checkpointy, vrtulniky,
   vyssi obtiznost, lezici postava
================================= */

let extraLives = 3;
let extraCheckpoints = [];
let extraRespawn = 70;
let extraHelis = [];
let extraBombs = [];
let extraGameOver = false;

const baseMission = mission;
const baseUpdate = update;
const baseDraw = draw;
const basePanel = panel;
const baseHud = hud;
const baseSoldier = soldier;
const basePress = press;

// Mobilni tlacitko
const proneButton = document.createElement("button");
proneButton.textContent = "Lehnout";
proneButton.dataset.k = "prone";
proneButton.style.background = "#455348";
proneButton.style.touchAction = "none";
document.querySelector("#touch > div:last-child")
  .appendChild(proneButton);

proneButton.onpointerdown = e => {
  e.preventDefault();
  proneButton.setPointerCapture(e.pointerId);
  press("prone");
};
proneButton.onpointerup = () => keys.delete("prone");
proneButton.onpointercancel = () => keys.delete("prone");
proneButton.onlostpointercapture =
  () => keys.delete("prone");

// Klavesa X - drzet pro lezeni
addEventListener("keydown", e => {
  if (e.code === "KeyX" && mode === "run") {
    e.preventDefault();
    press("prone");
  }
});

addEventListener("keyup", e => {
  if (e.code === "KeyX") keys.delete("prone");
});

// Uprava stisku tlacitek
press = function(k) {
  if (k === "prone") {
    if (mode === "run") keys.add("prone");
    return;
  }
  basePress(k);
};

// Zobrazeni zivotu
function extraHud() {
  let el = $("extraLives");

  if (!el) {
    el = document.createElement("span");
    el.id = "extraLives";
    el.className = "plate";
    $("hud").insertBefore(el, $("ammo"));
  }

  el.textContent = "Zivoty: " + extraLives;
}

hud = function() {
  baseHud();
  extraHud();
};

// Vytvoreni mise
mission = function(n) {
  baseMission(n);

  extraLives = 3;
  extraRespawn = 70;
  extraGameOver = false;
  extraBombs = [];

  extraCheckpoints = [];

  // Checkpointy pouze na pevne zemi
  for (let x = 800; x < end - 200; x += 850) {
    const ground = solids.find(s =>
      s.ground && x >= s.x + 30 &&
      x <= s.x + s.w - 30
    );

    if (ground) {
      extraCheckpoints.push({
        x: x,
        active: false
      });
    }
  }

  // Vrtulniky
  extraHelis = [];

  for (let x = 600; x < end - 100; x += 650) {
    extraHelis.push({
      x: x,
      home: x,
      y: floor - 190,
      hp: 80,
      maxHp: 80,
      phase: Math.random() * 6,
      cd: 2,
      attack: extraHelis.length % 2 === 0
    });
  }

  // Zvyseni obtiznosti
  foes.forEach((e, i) => {
    e.hp = Math.round(e.hp * (1.2 + n * 0.12));
    e.max = e.hp;
    e.cd *= 0.85;
  });

  extraHud();
};

// Ztrata zivota
function extraDie() {
  if (extraGameOver) return;

  extraLives--;
  extraHud();

  if (extraLives <= 0) {
    extraGameOver = true;
    basePanel("lost");
    $("title").textContent = "GAME OVER";
    $("summary").textContent =
      "Dosly ti vsechny tri zivoty.";
    $("action").textContent = "Hrat znovu";
    return;
  }

  ride = null;
  p.x = extraRespawn;
  p.y = floor;
  p.vx = 0;
  p.vy = 0;
  p.hp = 100;
  p.safe = 2.5;
  p.ground = true;
  p.grace = 0.1;
  p.duck = false;
  p.prone = false;

  keys.delete("prone");
  shots = [];
  extraBombs = [];

  // Vraceni kamery k checkpointu
  cam = clamp(
    p.x - width / zoom * 0.35,
    0,
    Math.max(0, end - width / zoom + 120)
  );

  message("Ztrata zivota! Zbyva: " + extraLives, 2);
  hud();
}

// Zachyceni konce hry
panel = function(state) {
  if (state === "lost" && !extraGameOver) {
    extraDie();
    return;
  }

  basePanel(state);
};

// Vlastni kresba leziciho vojaka
soldier = function(a, hero) {
  if (!hero || !p.prone || ride) {
    baseSoldier(a, hero);
    return;
  }

  g.save();
  g.translate(a.x, a.y);
  g.scale(a.dir, 1);

  if (p.safe > 0) {
    g.globalAlpha =
      0.55 + 0.4 * Math.abs(Math.sin(clock * 20));
  }

  // Nohy
  rect(-31, -11, 29, 8, "#454e3b");
  rect(-37, -7, 14, 6, "#282d29");

  // Telo
  rect(-8, -17, 29, 12, "#737c59");
  rect(0, -17, 14, 4, "#a4a283");

  // Hlava a helma
  ellipse(25, -11, 8, 6, "#ad9177");
  ellipse(24, -15, 9, 5, "#46503c");

  // Ruce a zbran
  rect(9, -9, 21, 5, "#5b644c");
  rect(27, -11, 25, 3, "#303631");

  g.restore();
};

// Herni aktualizace
update = function(dt) {
  if (mode !== "run") return;

  // Lehnuti pouze na zemi, mimo vozidlo
  const lying = keys.has("prone") &&
    !ride && p.ground;

  p.prone = lying;

  // Pri lezeni se postava nepohybuje
  const left = keys.has("left");
  const right = keys.has("right");
  const jump = keys.has("jump");

  if (lying) {
    keys.delete("left");
    keys.delete("right");
    keys.delete("jump");
    jumpBuffer = 0;
    p.vx = 0;

    // Strely nad lezici postavou ji minou
    for (const s of shots) {
      if (!s.enemy || s.life <= 0) continue;

      const nextX = s.x + s.vx * dt;

      if (
        Math.min(s.x, nextX) < p.x + 15 &&
        Math.max(s.x, nextX) > p.x - 15 &&
        s.y < p.y - 18
      ) {
        s.life = 0;
      }
    }
  }

  baseUpdate(dt);

  // Obnoveni drzenych smerovych klaves
  if (left) keys.add("left");
  if (right) keys.add("right");
  if (jump) keys.add("jump");

  if (mode !== "run") return;

  p.prone = lying && p.ground && !ride;

  // Checkpointy
  for (const cp of extraCheckpoints) {
    if (!cp.active && p.x >= cp.x) {
      cp.active = true;
      extraRespawn = cp.x;
      message("CHECKPOINT AKTIVOVAN", 2);
    }
  }

  // Pohyb a utoky vrtulniku
  for (const h of extraHelis) {
    if (h.hp <= 0) continue;

    h.phase += dt;

    h.x = h.home + Math.sin(h.phase * 0.6) * 75;
    h.y = floor - 190 + Math.sin(h.phase * 2) * 13;

    h.cd -= dt;

    if (
      h.attack &&
      Math.abs(h.x - p.x) < 380 &&
      h.cd <= 0
    ) {
      extraBombs.push({
        x: h.x,
        y: h.y + 15,
        vx: (p.x - h.x) * 0.35,
        vy: 140,
        life: 4
      });

      h.cd = 1.7 + Math.random();
    }

    // Zasahy vrtulniku
    for (const s of shots) {
      if (s.enemy || s.life <= 0) continue;

      if (
        Math.abs(s.x - h.x) < 43 &&
        Math.abs(s.y - h.y) < 24
      ) {
        h.hp -= s.w >= 4 ? 80 : 25;
        s.life = 0;
        puff(s.x, s.y, "#ffb347", 9, 1.2);

        if (h.hp <= 0) {
          puff(h.x, h.y, "#ff9030", 35, 2);
          shake = 6;
          kills++;
        }
      }
    }
  }

  // Projektily vrtulniku
  for (const b of extraBombs) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 90 * dt;
    b.life -= dt;

    if (
      Math.abs(b.x - p.x) < 16 &&
      Math.abs(b.y - (p.y - (p.prone ? 8 : 30)))
        < (p.prone ? 10 : 26)
    ) {
      hurt(22);
      b.life = 0;
    }

    if (b.y >= floor) {
      b.life = 0;
      puff(b.x, floor, "#e5a24a", 10, 1);
    }
  }

  extraBombs = extraBombs.filter(b => b.life > 0);
};

// Vykresleni
draw = function() {
  baseDraw();

  if (mode === "menu") return;

  g.save();
  g.translate(0, height * 0.82 - floor * zoom);
  g.scale(zoom, zoom);
  g.translate(-cam, 0);

  // Vlajky
  for (const cp of extraCheckpoints) {
    rect(cp.x, floor - 88, 4, 88, "#c1c3b5");
    rect(
      cp.x + 4, floor - 88, 32, 20,
      cp.active ? "#42d76d" : "#e5b84e"
    );

    g.font = "bold 11px monospace";
    g.fillStyle = "#202820";
    g.fillText("CP", cp.x + 9, floor - 74);
  }

  // Vrtulniky
  for (const h of extraHelis) {
    if (h.hp <= 0) continue;

    g.save();
    g.translate(h.x, h.y);

    // Ocas
    rect(-65, -7, 47, 7, "#56685c");
    rect(-65, -18, 5, 24, "#819183");

    // Trup
    ellipse(0, 0, 39, 17, "#536b60");
    ellipse(15, -3, 17, 11, "#91a9a7");

    // Podvozek
    rect(-24, 18, 49, 3, "#303b38");
    rect(-19, 10, 3, 9, "#303b38");
    rect(18, 10, 3, 9, "#303b38");

    // Rotor
    rect(-2, -23, 4, 9, "#363d39");
    const rotor = Math.sin(clock * 42) * 9;
    rect(-52 + rotor, -25, 104 - rotor * 2, 3,
      "#cbd4c9");

    if (h.attack) {
      rect(-12, 13, 24, 6, "#333c34");
      rect(0, 19, 5, 10, "#292f2b");
    }

    g.restore();

    // Ukazatel zdravi
    rect(h.x - 25, h.y - 38, 50, 4, "#702c2c");
    rect(h.x - 25, h.y - 38,
      50 * Math.max(0, h.hp / h.maxHp),
      4, "#8ed17a");
  }

  // Strely vrtulniku
  for (const b of extraBombs) {
    ellipse(b.x, b.y, 5, 7, "#ff9e36");
    ellipse(b.x, b.y, 2, 4, "#ffe5a1");
  }

  g.restore();
};

/* ==========================================
   SEDA FRONTA - PEVNE KOLIZE
   Vojaci, auta, motorky a tanky
   Vlozit na konec stavajiciho scriptu
========================================== */

const collisionOriginalUpdate = update;

// Sirka jednotlivych objektu
function collisionHalfWidth(obj) {
  if (obj.kind === "tank" || obj.tank) return 43;
  if (obj.kind === "jeep") return 38;
  if (obj.kind === "bike") return 23;
  return 12;
}

// Kontrola, zda jsou objekty ve stejne vysce
function collisionSameHeight(a, b) {
  const aTop = a.y - (a.kind ? 48 : a.tank ? 50 : 53);
  const bTop = b.y - (b.kind ? 48 : b.tank ? 50 : 53);

  return a.y > bTop + 5 && b.y > aTop + 5;
}

// Seznam prekazek
function collisionObstacles() {
  const obstacles = [];

  // Zivi nepratelsti vojaci a tanky
  for (const enemy of foes) {
    if (enemy.hp > 0) {
      obstacles.push(enemy);
    }
  }

  // Zaparkovana vozidla
  for (const car of cars) {
    if (car !== ride) {
      obstacles.push({
        x: car.x,
        y: floor,
        kind: car.kind
      });
    }
  }

  return obstacles;
}

// Zastaveni pri pokusu projet prekazkou
function collisionStop(oldX, newX) {
  const playerObject = {
    x: newX,
    y: p.y,
    kind: ride ? ride.kind : null
  };

  const playerRadius = ride
    ? collisionHalfWidth(ride)
    : 11;

  let result = newX;

  for (const obstacle of collisionObstacles()) {
    if (!collisionSameHeight(playerObject, obstacle)) {
      continue;
    }

    const radius =
      playerRadius + collisionHalfWidth(obstacle);

    const left = obstacle.x - radius;
    const right = obstacle.x + radius;

    // Zleva do prekazky
    if (oldX <= left && newX > left) {
      result = Math.min(result, left);
    }

    // Zprava do prekazky
    if (oldX >= right && newX < right) {
      result = Math.max(result, right);
    }
  }

  return result;
}

// Rozsireni aktualizace hry
update = function(dt) {
  if (mode !== "run") {
    collisionOriginalUpdate(dt);
    return;
  }

  const oldX = p.x;

  // Zapamatujeme si pozice nepratel
  const enemyPositions = foes.map(e => e.x);

  collisionOriginalUpdate(dt);

  if (mode !== "run") return;

  // Hrac ani vozidlo neprojdou skrz prekazku
  const correctedX = collisionStop(oldX, p.x);

  if (correctedX !== p.x) {
    p.x = correctedX;
    p.vx = 0;

    if (ride) {
      ride.x = p.x;
    }
  }

  // Nepratele nesmeji projit skrz hrace
  for (let i = 0; i < foes.length; i++) {
    const enemy = foes[i];

    if (enemy.hp <= 0) continue;

    if (!collisionSameHeight(
      {x:p.x,y:p.y,kind:ride?.kind},
      enemy
    )) continue;

    const radius =
      (ride ? collisionHalfWidth(ride) : 11)
      + collisionHalfWidth(enemy);

    const previousDistance =
      Math.abs(enemyPositions[i] - p.x);

    const currentDistance =
      Math.abs(enemy.x - p.x);

    if (
      previousDistance >= radius &&
      currentDistance < radius
    ) {
      enemy.x = enemyPositions[i];
    }
  }
};

/* =========================================
   SEDA FRONTA - JESKYNE A TUNELY
   Pridat na konec stavajiciho skriptu
========================================= */

const caveOldMission = mission;
const caveOldUpdate = update;
const caveOldDraw = draw;

let caveAreas = [];
let caveInside = null;
let caveHintTime = 0;

// Vytvoreni podzemnich oblasti
mission = function(n) {
  caveOldMission(n);
  caveAreas = [];
  caveInside = null;

  // Tunely v kazde misi
  for (let x = 950; x < end - 520; x += 1150) {
    // Tunel musi byt pod souvislou zemi
    const ground = solids.find(s =>
      s.ground &&
      x >= s.x + 40 &&
      x + 410 <= s.x + s.w - 40
    );

    if (!ground) continue;

    caveAreas.push({
      x: x,
      w: 410,
      y: floor + 42,
      h: 100,
      shaft: x + 205,
      name: n === 1 ? "PODZEMNI BUNKR" :
            n === 2 ? "SKALNI JESKYNE" :
                      "TAJNY TUNEL"
    });
  }

  message("Pro vstup do jeskyni stiskni T", 4);
};

// Nejblizsi vstup
function caveNearestEntrance() {
  let found = null;
  let distance = 42;

  for (const c of caveAreas) {
    for (const x of [c.x, c.shaft, c.x + c.w]) {
      const d = Math.abs(p.x - x);
      if (d < distance) {
        distance = d;
        found = {c, x};
      }
    }
  }

  return found;
}

// Vstup a vystup
function caveToggle() {
  if (mode !== "run") return;

  if (caveInside) {
    const c = caveInside;
    const exits = [c.x, c.shaft, c.x + c.w];

    let exit = exits[0];
    for (const x of exits) {
      if (Math.abs(x - p.x) < Math.abs(exit - p.x)) {
        exit = x;
      }
    }

    if (Math.abs(exit - p.x) > 43) {
      message("Dojdi ke vstupu nebo k zeb riku", 2);
      return;
    }

    p.x = exit;
    p.y = floor;
    p.vx = 0;
    p.vy = 0;
    p.ground = true;
    p.grace = 0.1;
    p.safe = Math.max(p.safe, 0.8);
    caveInside = null;
    message("Vystoupil jsi z podzemi", 2);
    return;
  }

  if (ride) {
    message("Nejdrive vystup z vozidla", 2);
    return;
  }

  if (!p.ground) return;

  const entrance = caveNearestEntrance();
  if (!entrance) {
    message("Pribliz se ke vchodu do jeskyne", 2);
    return;
  }

  caveInside = entrance.c;
  p.x = entrance.x;
  p.y = caveInside.y + caveInside.h - 10;
  p.vx = 0;
  p.vy = 0;
  p.ground = true;
  p.safe = Math.max(p.safe, 1);

  message(caveInside.name + " - T: vystup", 3);
}

// Klavesa T
addEventListener("keydown", e => {
  if (e.code === "KeyT" && !e.repeat) {
    e.preventDefault();
    caveToggle();
  }
});

// Mobilni tlacitko
const caveTouchButton = document.createElement("button");
caveTouchButton.textContent = "Tunel";
caveTouchButton.style.background = "#51483b";
caveTouchButton.style.touchAction = "manipulation";

const caveTouchArea =
  document.querySelector("#touch > div:last-child");

if (caveTouchArea) {
  caveTouchArea.appendChild(caveTouchButton);
}

caveTouchButton.addEventListener("pointerdown", e => {
  e.preventDefault();
  caveToggle();
});

// Aktualizace pohybu pod zemi
update = function(dt) {
  if (!caveInside || mode !== "run") {
    caveOldUpdate(dt);
    return;
  }

  const c = caveInside;
  const direction =
    Number(keys.has("right")) -
    Number(keys.has("left"));

  p.vx = direction * 125;
  p.x = clamp(
    p.x + p.vx * dt,
    c.x + 8,
    c.x + c.w - 8
  );

  if (direction) p.dir = direction;

  p.walk += Math.abs(p.vx) * dt / 28;
  p.y = c.y + c.h - 10;
  p.vy = 0;
  p.ground = true;
  p.safe = Math.max(p.safe, 0.2);

  sessionTime += dt;
  p.cd = Math.max(0, p.cd - dt);
  caveHintTime += dt;

  // Kamera sleduje hrace
  const target = clamp(
    p.x - width / zoom * 0.35,
    0,
    Math.max(0, end - width / zoom + 120)
  );

  cam += (target - cam) *
    (1 - Math.exp(-dt * 7));

  if (caveHintTime > 7) {
    caveHintTime = 0;
    message("T: vystup | A/D: pohyb", 2);
  }
};

// Pixel-art bloky kamene
function caveStone(x, y, w, h, seed) {
  rect(x, y, w, h, "#4b514a");

  for (let j = 0; j < h; j += 16) {
    for (let i = 0; i < w; i += 22) {
      const noise = Math.abs(
        Math.sin((i + x) * 0.17 +
                 (j + y) * 0.31 + seed)
      );

      rect(
        x + i + 2,
        y + j + 2,
        15,
        10,
        noise > 0.6 ? "#697269" : "#596258"
      );

      rect(
        x + i + 3,
        y + j + 3,
        8,
        2,
        "#7d8575"
      );
    }
  }
}

// Vykresleni jeskyne
function caveDrawArea(c) {
  const x = c.x;
  const y = c.y;
  const w = c.w;
  const h = c.h;

  // Podzemni chodba
  rect(x, y, w, h, "#202722");

  // Skalni strop
  caveStone(x, y - 22, w, 22, x);

  // Skalni podlaha
  caveStone(x, y + h - 10, w, 25, x + 12);

  // Zadni skalni stena
  for (let i = 18; i < w - 15; i += 42) {
    rect(x + i, y + 12, 3, 40, "#343d37");
    rect(x + i + 4, y + 22, 15, 2, "#4e594e");
  }

  // Drevene podpery
  for (let i = 35; i < w; i += 100) {
    rect(x + i, y + 5, 8, h - 15, "#765c3e");
    rect(x + i - 10, y + 5, 28, 7, "#9a7950");
    rect(x + i + 2, y + 13, 2, h - 25, "#b08a5a");
  }

  // Svetla
  for (let i = 65; i < w; i += 130) {
    ellipse(x + i, y + 16, 19, 13, "#5c5331");
    rect(x + i - 5, y + 7, 10, 5, "#e6b85d");
    rect(x + i - 2, y + 12, 4, 3, "#fff0a5");
  }

  // Kameny na podlaze
  for (let i = 20; i < w; i += 57) {
    rect(x + i, y + h - 17, 14, 7, "#73786b");
    rect(x + i + 4, y + h - 20, 7, 3, "#8b9080");
  }

  // Zebrik do jeskyne
  rect(c.shaft - 12, y - 5, 3, h - 5, "#a58b60");
  rect(c.shaft + 9, y - 5, 3, h - 5, "#a58b60");

  for (let j = 5; j < h - 8; j += 13) {
    rect(c.shaft - 10, y + j, 20, 3, "#c0a171");
  }

  // Nazev jeskyne
  g.font = "bold 12px monospace";
  g.fillStyle = "#e9d49b";
  g.fillText(c.name, x + 15, y + 42);
}

// Vstupni portaly na povrchu
function caveDrawEntrances(c) {
  const xs = [c.x, c.x + c.w];

  for (const x of xs) {
    // Skala okolo vchodu
    rect(x - 24, floor - 72, 48, 72, "#505b50");
    rect(x - 19, floor - 66, 38, 66, "#6b7769");

    // Tmavy otvor
    rect(x - 13, floor - 53, 26, 53, "#171e1a");
    rect(x - 10, floor - 57, 20, 7, "#2c342d");

    // Kamenny oblouk
    rect(x - 20, floor - 61, 7, 61, "#879080");
    rect(x + 13, floor - 61, 7, 61, "#879080");
    rect(x - 20, floor - 68, 40, 9, "#9a9d87");

    // Znacka
    rect(x - 13, floor - 91, 26, 15, "#c0a16b");
    g.font = "bold 11px monospace";
    g.fillStyle = "#262b22";
    g.fillText("T", x - 4, floor - 79);
  }

  // Vstup shora
  rect(c.shaft - 18, floor - 5, 36, 5, "#c9b27b");
  rect(c.shaft - 15, floor - 13, 4, 13, "#a38c64");
  rect(c.shaft + 11, floor - 13, 4, 13, "#a38c64");

  g.font = "bold 11px monospace";
  g.fillStyle = "#f5d27e";
  g.fillText("T", c.shaft - 4, floor - 22);
}

// Vykreslovani
draw = function() {
  caveOldDraw();

  if (mode === "menu" || !caveAreas.length) return;

  g.save();

  g.translate(
    0,
    height * 0.82 - floor * zoom
  );
  g.scale(zoom, zoom);
  g.translate(-cam, 0);

  const visibleRight = cam + width / zoom;

  for (const c of caveAreas) {
    if (c.x > visibleRight + 100 ||
        c.x + c.w < cam - 100) continue;

    caveDrawArea(c);
    caveDrawEntrances(c);
  }

  // Postava uvnitr tunelu
  if (caveInside) {
    soldier(p, true);

    // Ukazatel polohy postavy
    g.font = "bold 12px monospace";
    g.fillStyle = "#f4cf77";
    g.fillText(
      "T = VYSTUP",
      p.x - 35,
      p.y - 78
    );
  }

  g.restore();
};
